[project]
name = "west-consumer"
version = "0.1.0"
description = "West Consumer"
authors = [
    {name = "lukaszlacinski", email = "lukasz@uchicago.edu"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.6.0",
    # "esgf-core-utils>=1.0.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.8.1",
]

[project.optional-dependencies]
ceda = [
    "httpx>=0.28.1",
    "httpx-auth>=0.23.1",
]
globus = [
    "boto3>=1.35.49",
    "globus-sdk>=3.46.0",
    "jsonpatch>=1.33",
]

[tool.poetry]
packages = [
    { include = "src" }
]
package-mode = false

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]
